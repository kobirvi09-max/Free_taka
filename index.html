<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE TAKA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* আপনার পূর্বের style.css কোডগুলো এখানে থাকবে */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f9; }
        .screen { display: none; padding: 20px; }
        .screen.active { display: block; }
        .user-profile { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .balance-card { background: #fff; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .stats-container { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: #fff; padding: 15px; border-radius: 10px; text-align: center; }
        .refer-box { background: #fff; padding: 15px; border-radius: 10px; }
        .ref-link-area { display: flex; gap: 5px; margin-top: 10px; }
        input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 8px 15px; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #ddd; }
        .nav-item { cursor: pointer; text-align: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active">
        <div class="user-profile">
            <div class="user-info">
                <h3 id="username">ব্যবহারকারী</h3>
                <p>ব্যালেন্স: ৳<span id="user-balance">0.00</span></p>
            </div>
        </div>

        <div class="balance-card">
            <p>মোট ব্যালেন্স</p>
            <h1>৳<span id="total-balance">0.00</span></h1>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <p>আজকের অ্যাড</p>
                <h2><span id="ads-count">0</span> / 15</h2>
            </div>
            <div class="stat-box">
                <p>মোট রেফার</p>
                <h2><span id="refer-count">0</span> টি</h2>
            </div>
        </div>

        <div class="refer-box">
            <p>বন্ধুদের রেফার করুন, তারা জয়েন করলে বোনাস পাবেন!</p>
            <div class="ref-link-area">
                <input type="text" id="ref-url" readonly>
                <button onclick="copyRef()"><i class="fa-solid fa-copy"></i></button>
            </div>
        </div>
    </div>

    <div id="task-screen" class="screen">
        <h2>Task List</h2>
        <button onclick="showMonetagAd()">বিজ্ঞাপন দেখুন (৳৭ আয়)</button>
    </div>

    <div id="withdraw-screen" class="screen">
        <h2>Withdraw</h2>
        <p>ব্যালেন্স উইথড্র করার অপশন...</p>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchScreen('home-screen', this)"><span>HOME</span></div>
        <div class="nav-item" onclick="switchScreen('task-screen', this)"><span>TASK</span></div>
        <div class="nav-item" onclick="switchScreen('withdraw-screen', this)"><span>WITHDRAW</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        let userId = tg.initDataUnsafe?.user?.id || "guest";
        document.getElementById('username').innerText = tg.initDataUnsafe?.user?.first_name || "ব্যবহারকারী";

        // রেফারেল লিংক সেটআপ
        document.getElementById('ref-url').value = "https://t.me/Freetaka12bot/app?startapp=" + userId;

        // ডেটা লোড
        let balance = parseFloat(localStorage.getItem('user_balance')) || 0.00;
        let adsWatched = parseInt(localStorage.getItem('ads_watched')) || 0;
        let totalRefers = parseInt(localStorage.getItem('total_refers')) || 0;

        function updateUI() {
            document.getElementById('user-balance').innerText = balance.toFixed(2);
            document.getElementById('total-balance').innerText = balance.toFixed(2);
            document.getElementById('ads-count').innerText = adsWatched;
            document.getElementById('refer-count').innerText = totalRefers;
        }
        updateUI();

        // শুধুমাত্র লিংক কপি হবে, বোনাস বা রেফার কাউন্ট যোগ হবে না
        function copyRef() {
            const copyText = document.getElementById("ref-url");
            copyText.select();
            document.execCommand("copy");
            alert("লিংক কপি হয়েছে!");
        }

        function switchScreen(screenId, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            element.classList.add('active');
        }

        function showMonetagAd() {
            if (adsWatched >= 15) { alert("লিমিট শেষ!"); return; }
            balance += 7.00;
            adsWatched += 1;
            localStorage.setItem('user_balance', balance);
            localStorage.setItem('ads_watched', adsWatched);
            updateUI();
            alert("৳৭ যোগ হয়েছে!");
        }
    </script>
</body>
</html>
