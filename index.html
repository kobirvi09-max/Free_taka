<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE TAKA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="home-screen" class="screen active">
        <div class="user-profile">
            <div class="user-info">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div class="user-text">
                    <h3 id="username">ব্যবহারকারী</h3>
                    <p class="sub-text">ব্যালেন্স: ৳<span id="user-balance">0.00</span> 💰</p>
                </div>
            </div>
            <button class="notif-btn"><i class="fa-solid fa-bell"></i></button>
        </div>

        <div class="balance-card">
            <p>মোট ব্যালেন্স</p>
            <h1>৳<span id="total-balance">0.00</span></h1>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <i class="fa-solid fa-video" style="color: #38bdf8;"></i>
                <p>অ্যাড দেখা হয়েছে</p>
                <h2 id="ads-count">0</h2>
            </div>
            <div class="stat-box">
                <i class="fa-solid fa-users" style="color: #a855f7;"></i>
                <p>মোট রেফার</p>
                <h2 id="refer-count">0</h2>
            </div>
        </div>

        <div class="refer-box">
            <p><i class="fa-solid fa-share-nodes"></i> বন্ধুদের রেফার করুন এবং প্রতি রেফারে বোনাস পান! 🎁</p>
            <div class="ref-link-area">
                <input type="text" id="ref-url" value="https://t.me/FreeTakaBot/app" readonly>
                <button onclick="copyRef()"><i class="fa-solid fa-copy"></i></button>
            </div>
        </div>
    </div>

    <div id="task-screen" class="screen">
        <div class="ad-card">
            <i class="fa-solid fa-video ad-icon"></i>
            <h2>Rewarded Ad</h2>
            <p>প্রতিটি বিজ্ঞাপন দেখার জন্য ৩০ টাকা আয় করুন।</p>
            <button class="action-btn">বিজ্ঞাপন দেখুন</button>
        </div>
    </div>

    <div id="withdraw-screen" class="screen">
        <div class="withdraw-card">
            <h2><i class="fa-solid fa-wallet"></i> Withdraw</h2>
            <div class="input-group">
                <label>মেথড সিলেক্ট করুন</label>
                <select id="method">
                    <option value="bkash">BKash (মিনিমাম ২০০০)</option>
                    <option value="nagad">Nagad (মিনিমাম ২০০০)</option>
                </select>
            </div>
            <div class="input-group">
                <label>অ্যাকাউন্ট নাম্বার</label>
                <input type="number" placeholder="017XXXXXXXX">
            </div>
            <div class="input-group">
                <label>পরিমাণ (Amount)</label>
                <input type="number" placeholder="2000">
            </div>
            <button class="action-btn" style="background: #a855f7;">Request Withdraw</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchScreen('home-screen', this)">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
        </div>
        <div class="nav-item" onclick="switchScreen('task-screen', this)">
            <i class="fa-solid fa-crown"></i>
            <span>TASK</span>
        </div>
        <div class="nav-item" onclick="switchScreen('withdraw-screen', this)">
            <i class="fa-solid fa-gift"></i>
            <span>WITHDRAW</span>
        </div>
    </div>

    <script>
        // টেলিগ্রাম ডাটা লোড করা
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        if(tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        // স্ক্রিন পরিবর্তন করার ফাংশন
        function switchScreen(screenId, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(screenId).classList.add('active');
            element.classList.add('active');
        }

        // রেফার লিংক কপি করার ফাংশন
        function copyRef() {
            const copyText = document.getElementById("ref-url");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("রেফার লিংক কপি হয়েছে!");
        }
    </script>
</body>
</html>
