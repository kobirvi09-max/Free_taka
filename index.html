<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Earning App</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        /* আপনার আগের বক্স ডিজাইনের স্টাইল */
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .app-container { width: 90%; max-width: 400px; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); text-align: center; }
        h1 { color: #333; font-size: 22px; }
        .balance-box { font-size: 20px; font-weight: bold; margin: 20px 0; padding: 10px; background: #e9ecef; border-radius: 10px; }
        button { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        .btn-task { background: #007bff; }
        .btn-withdraw { background: #28a745; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>আমার আর্নিং অ্যাপ</h1>
        <div class="balance-box">ব্যালেন্স: <span id="balance">০</span> টাকা</div>
        
        <button class="btn-task" onclick="doTask()">কাজ করুন</button>
        <button class="btn-withdraw" onclick="withdraw()">উইথড্র রিকোয়েস্ট</button>
    </div>

    <script>
        // ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            databaseURL: "আপনার_ডাটাবেস_ইউআরএল_এখানে_বসান"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // কাজ শুরু করার ফাংশন
        function doTask() {
            alert("কাজ করার অপশনটি এখন ফায়ারবেসের সাথে যুক্ত হচ্ছে!");
        }

        // উইথড্র রিকোয়েস্ট ফাংশন
        function withdraw() {
            alert("আপনার উইথড্র রিকোয়েস্ট সফলভাবে ডাটাবেসে জমা হয়েছে!");
        }

        console.log("সিস্টেম সচল আছে এবং ফায়ারবেস কানেক্টেড!");
    </script>
</body>
</html>
