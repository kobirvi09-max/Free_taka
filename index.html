<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE TAKA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>(function(s){s.dataset.zone='11062752',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</head>
<body>

    <div id="task-screen" class="screen active">
        <div class="ad-card">
            <i class="fa-solid fa-video ad-icon"></i>
            <h2>Rewarded Ad</h2>
            <p>বিজ্ঞাপন দেখুন এবং টাকা আয় করুন।</p>
            <button class="action-btn" id="ad-btn" onclick="addBalance()">বিজ্ঞাপন দেখুন</button>
        </div>
    </div>

    <script>
        function addBalance() {
            let balance = parseFloat(localStorage.getItem('user_balance')) || 0.00;
            let adsWatched = parseInt(localStorage.getItem('ads_watched')) || 0;

            if (adsWatched >= 15) {
                alert("আজকের লিমিট শেষ!");
                return;
            }

            // ব্যালেন্স যোগ করা হচ্ছে
            balance += 7.00;
            adsWatched += 1;
            localStorage.setItem('user_balance', balance);
            localStorage.setItem('ads_watched', adsWatched);
            
            alert("অভিনন্দন! আপনার ব্যালেন্সে ৭ টাকা যোগ হয়েছে।");
            location.reload();
        }
    </script>
</body>
</html>
